<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-label="BioSampleTrack 3D glassmorphism logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0b1e38"/>
    </linearGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7fb6ff" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0f6bbd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="dnaStrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <radialGradient id="dnaBall" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f9ff" stop-opacity="0.6"/>
    </radialGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="240" fill="url(#bg)"/>

  <!-- Ambient glow blobs behind the tile -->
  <g opacity="0.5">
    <ellipse cx="145" cy="130" rx="120" ry="90" fill="url(#glow)" filter="url(#blurBig)" opacity="0.55"/>
    <ellipse cx="420" cy="100" rx="150" ry="70" fill="#0f6bbd" opacity="0.35" filter="url(#blurBig)"/>
  </g>

  <!-- Blur filter used by ambient glow -->
  <filter id="blurBig" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="30"/>
  </filter>

  <!-- 3D glass tile -->
  <g filter="url(#shadow)">
    <rect x="50" y="34" width="170" height="172" rx="38" fill="url(#tile)" stroke="url(#tileEdge)" stroke-width="2"/>
    <!-- top specular bevel (glass edge) -->
    <path d="M88 48 Q120 40 150 48" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- left sheen -->
    <rect x="60" y="46" width="26" height="148" rx="13" fill="#ffffff" opacity="0.12"/>
    <rect x="60" y="46" width="12" height="148" rx="6" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- DNA / biosample mark -->
  <g transform="translate(135 120)" opacity="0.96">
    <!-- outer ring -->
    <circle r="56" stroke="url(#dnaStrand)" stroke-width="5" fill="none" opacity="0.9"/>
    <!-- rotating rungs -->
    <g opacity="0.75">
      <line x1="0" y1="-56" x2="0" y2="56" stroke="#7fd4ff" stroke-width="3" stroke-linecap="round" transform="rotate(0)"/>
      <line x1="0" y1="-56" x2="0" y2="56" stroke="#7fd4ff" stroke-width="3" stroke-linecap="round" transform="rotate(45)" opacity="0.6"/>
      <line x1="0" y1="-56" x2="0" y2="56" stroke="#7fd4ff" stroke-width="3" stroke-linecap="round" transform="rotate(90)"/>
      <line x1="0" y1="-56" x2="0" y2="56" stroke="#7fd4ff" stroke-width="3" stroke-linecap="round" transform="rotate(135)" opacity="0.6"/>
    </g>
    <!-- cardinal strand ends -->
    <circle r="13" fill="url(#dnaBall)" stroke="#bfe7ff" stroke-width="2" transform="translate(0 -56)"/>
    <circle r="13" fill="url(#dnaBall)" stroke="#bfe7ff" stroke-width="2" transform="translate(0 56)"/>
    <circle r="13" fill="url(#dnaBall)" stroke="#bfe7ff" stroke-width="2" transform="translate(-56 0)"/>
    <circle r="13" fill="url(#dnaBall)" stroke="#bfe7ff" stroke-width="2" transform="translate(56 0)"/>
    <!-- helix core emphasis -->
    <circle r="30" fill="#0f6bbd" opacity="0.35"/>
    <circle r="12" fill="url(#dnaBall)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(252 78)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff" opacity="0.96" letter-spacing="-1.5">BioSample</text>
    <text x="0" y="66" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff" opacity="0.96" letter-spacing="-1.5">Track</text>
    <text x="0" y="100" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#7dd3fc" letter-spacing="4">NGS WORKFLOW MANAGER</text>
  </g>
</svg>
